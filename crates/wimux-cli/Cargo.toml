[package]
name = "wimux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A native Windows terminal multiplexer: persistent detached sessions over ConPTY, driven from a TUI, a native GUI or a scriptable CLI."
keywords = ["terminal", "multiplexer", "tmux", "conpty", "windows"]
categories = ["command-line-utilities", "os::windows-apis"]
readme = "README.md"

[[bin]]
name = "wimux"
path = "src/main.rs"

[dependencies]
wimux-protocol.workspace = true
wimux-client.workspace = true
crossterm = "0.29.0"
