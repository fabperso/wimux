<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
  </head>

  <body>
    <div id="app">
      <aside id="rail">
        <div id="sessions"></div>
        <div id="rail-actions">
          <button id="new-session" title="Nouvelle session">+</button>
          <!-- Features agent (M2) + lot (M3) masquees le temps de se concentrer sur
               la parite CMUX (W-serie). Backend conserve ; retirer `hidden` pour reactiver. -->
          <button id="new-agent" title="Lancer un agent" hidden>+ agent</button>
          <button id="new-batch" title="Lancer un lot d'agents" hidden>⇉ lot</button>
        </div>
      </aside>
      <div id="workspace">
        <div id="tabs"></div>
        <div id="terminal"></div>
      </div>
    </div>

    <div id="agent-modal" class="modal-overlay hidden">
      <div class="modal">
        <h2>Lancer un agent</h2>
        <label>Modèle
          <select id="agent-template"></select>
        </label>
        <label>Tâche / prompt
          <textarea id="agent-prompt" rows="4"></textarea>
        </label>
        <label>Répertoire (optionnel)
          <input id="agent-cwd" type="text" placeholder="cwd du daemon par défaut" />
        </label>
        <label>Nom (optionnel)
          <input id="agent-name" type="text" placeholder="auto : <modèle>-<n>" />
        </label>
        <div id="agent-error" class="agent-error"></div>
        <div class="modal-buttons">
          <button id="agent-cancel">Annuler</button>
          <button id="agent-launch">Lancer</button>
        </div>
      </div>
    </div>

    <div id="batch-modal" class="modal-overlay hidden">
      <div class="modal">
        <h2>Lancer un lot d'agents</h2>
        <label>Repo de base (git)
          <input id="batch-repo" type="text" placeholder="C:\chemin\vers\repo" />
        </label>
        <label>Modèle
          <select id="batch-template"></select>
        </label>
        <label>Tâche / prompt
          <textarea id="batch-prompt" rows="4"></textarea>
        </label>
        <label>Nombre d'agents
          <input id="batch-count" type="number" min="1" value="2" />
        </label>
        <div id="batch-error" class="agent-error"></div>
        <div class="modal-buttons">
          <button id="batch-cancel">Annuler</button>
          <button id="batch-launch">Lancer</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
